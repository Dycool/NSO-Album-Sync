name: Build and Release NSO Album Sync

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # WINDOWS BUILD (x64 and ARM64)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build & Publish Windows x64
        run: |
          dotnet publish NsoAlbumSync.csproj -f net8.0-windows -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./dist/win-x64
          Compress-Archive -Path ./dist/win-x64/nso-album-sync.exe -DestinationPath ./dist/nso-album-sync-windows-x64.zip

      - name: Build & Publish Windows ARM64
        run: |
          dotnet publish NsoAlbumSync.csproj -f net8.0-windows -c Release -r win-arm64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./dist/win-arm64
          Compress-Archive -Path ./dist/win-arm64/nso-album-sync.exe -DestinationPath ./dist/nso-album-sync-windows-arm64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            ./dist/nso-album-sync-windows-x64.zip
            ./dist/nso-album-sync-windows-arm64.zip
            ./dist/win-x64/nso-album-sync.exe

  # ==========================================
  # MACOS BUILD (ARM64 Apple Silicon & x64 Intel) + CODESIGN
  # ==========================================
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build & Publish macOS ARM64 (Apple Silicon)
        run: |
          dotnet publish NsoAlbumSync.csproj -f net8.0 -c Release -r osx-arm64 --self-contained false -p:PublishSingleFile=true -o ./dist/osx-arm64
          chmod +x ./dist/osx-arm64/nso-album-sync
          echo "Ad-hoc codesigning macOS ARM64 binary..."
          codesign --force --deep --sign - ./dist/osx-arm64/nso-album-sync
          tar -czvf ./dist/nso-album-sync-macos-arm64.tar.gz -C ./dist/osx-arm64 nso-album-sync

      - name: Build & Publish macOS x64 (Intel)
        run: |
          dotnet publish NsoAlbumSync.csproj -f net8.0 -c Release -r osx-x64 --self-contained false -p:PublishSingleFile=true -o ./dist/osx-x64
          chmod +x ./dist/osx-x64/nso-album-sync
          echo "Ad-hoc codesigning macOS x64 binary..."
          codesign --force --deep --sign - ./dist/osx-x64/nso-album-sync
          tar -czvf ./dist/nso-album-sync-macos-x64.tar.gz -C ./dist/osx-x64 nso-album-sync

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: |
            ./dist/nso-album-sync-macos-arm64.tar.gz
            ./dist/nso-album-sync-macos-x64.tar.gz

  # ==========================================
  # LINUX BUILD (x64 and ARM64)
  # ==========================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build & Publish Linux x64
        run: |
          dotnet publish NsoAlbumSync.csproj -f net8.0 -c Release -r linux-x64 --self-contained false -p:PublishSingleFile=true -o ./dist/linux-x64
          chmod +x ./dist/linux-x64/nso-album-sync
          tar -czvf ./dist/nso-album-sync-linux-x64.tar.gz -C ./dist/linux-x64 nso-album-sync

      - name: Build & Publish Linux ARM64
        run: |
          dotnet publish NsoAlbumSync.csproj -f net8.0 -c Release -r linux-arm64 --self-contained false -p:PublishSingleFile=true -o ./dist/linux-arm64
          chmod +x ./dist/linux-arm64/nso-album-sync
          tar -czvf ./dist/nso-album-sync-linux-arm64.tar.gz -C ./dist/linux-arm64 nso-album-sync

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            ./dist/nso-album-sync-linux-x64.tar.gz
            ./dist/nso-album-sync-linux-arm64.tar.gz

  # ==========================================
  # GITHUB RELEASE (On Tags)
  # ==========================================
  release:
    needs: [ build-windows, build-macos, build-linux ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts

      - name: Display downloaded files
        run: ls -R ./release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-artifacts/windows-binaries/nso-album-sync-windows-x64.zip
            ./release-artifacts/windows-binaries/nso-album-sync-windows-arm64.zip
            ./release-artifacts/windows-binaries/nso-album-sync.exe
            ./release-artifacts/macos-binaries/nso-album-sync-macos-arm64.tar.gz
            ./release-artifacts/macos-binaries/nso-album-sync-macos-x64.tar.gz
            ./release-artifacts/linux-binaries/nso-album-sync-linux-x64.tar.gz
            ./release-artifacts/linux-binaries/nso-album-sync-linux-arm64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
