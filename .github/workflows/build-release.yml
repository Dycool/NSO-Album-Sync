name: Build and Release NSO Album Sync

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore NsoAlbumSync.csproj

      - name: Build and Publish Windows x64
        run: |
          dotnet publish NsoAlbumSync.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./dist/win-x64
          Compress-Archive -Path ./dist/win-x64/nso-album-sync.exe -DestinationPath ./dist/nso-album-sync-windows-x64.zip

      - name: Build and Publish Windows ARM64
        run: |
          dotnet publish NsoAlbumSync.csproj -c Release -r win-arm64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./dist/win-arm64
          Compress-Archive -Path ./dist/win-arm64/nso-album-sync.exe -DestinationPath ./dist/nso-album-sync-windows-arm64.zip

      - name: Upload Windows x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nso-album-sync-windows-x64
          path: ./dist/nso-album-sync-windows-x64.zip

      - name: Upload Windows ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nso-album-sync-windows-arm64
          path: ./dist/nso-album-sync-windows-arm64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/nso-album-sync-windows-x64.zip
            ./dist/nso-album-sync-windows-arm64.zip
            ./dist/win-x64/nso-album-sync.exe
          draft: false
          prerelease: false
          generate_release_notes: true
