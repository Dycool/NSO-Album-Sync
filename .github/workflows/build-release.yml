name: Build and Release NSO Album Sync

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nso-album-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            cmake_arch: x64
          - arch: arm64
            runner: windows-11-arm
            cmake_arch: ARM64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -A "${{ matrix.cmake_arch }}" `
            -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
            -DNSO_STATIC_RUNTIME=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: cmake --build build --config $env:BUILD_TYPE --parallel

      - name: Stage Windows build
        shell: pwsh
        run: |
          $out = "dist/windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $exe = "build/$env:BUILD_TYPE/nso-album-sync.exe"
          Copy-Item $exe "$out/nso-album-sync.exe"

          $size = (Get-Item $exe).Length
          Write-Host ("Application executable size: {0:N2} MB" -f ($size / 1MB))
          if ($size -gt 10MB) {
            Write-Warning "Application executable is above the 10 MB target."
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          # GitHub Actions artifacts are already downloaded as .zip files.
          # Upload the raw executable so users get one zip containing the .exe,
          # rather than an outer artifact zip containing another zip.
          name: nso-album-sync-windows-${{ matrix.arch }}
          path: dist/windows-${{ matrix.arch }}/nso-album-sync.exe
          if-no-files-found: error

  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        shell: bash
        run: brew install cmake ninja openssl@3

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DNSO_STATIC_RUNTIME=ON

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Verify local signature and package app
        shell: bash
        run: |
          set -euo pipefail
          app="build/nso-album-sync.app"
          binary="$app/Contents/MacOS/nso-album-sync"

          if [[ ! -d "$app" ]]; then
            echo "macOS app bundle was not produced." >&2
            exit 1
          fi

          size="$(stat -f%z "$binary")"
          python3 -c 'import sys; s=int(sys.argv[1]); print(f"Application executable size: {s/1024/1024:.2f} MB"); print("::warning::Application executable is above the 10 MB target.") if s > 10*1024*1024 else None' "$size"

          # CMake ad-hoc signs every local macOS build. Verify that signature
          # before packaging so CI cannot publish an unsigned .app by accident.
          codesign --verify --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "dist/nso-album-sync-macos-${{ matrix.arch }}.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: nso-album-sync-macos-${{ matrix.arch }}
          path: dist/nso-album-sync-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  build-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libssl-dev libsecret-1-dev \
            libgtk-3-dev libayatana-appindicator3-dev

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DNSO_STATIC_RUNTIME=ON \
            -DNSO_ENABLE_LINUX_TRAY=ON

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Strip and package Linux build
        shell: bash
        run: |
          set -euo pipefail
          out="dist/linux-${{ matrix.arch }}"
          mkdir -p "$out"

          cp build/nso-album-sync "$out/"
          strip "$out/nso-album-sync"

          size="$(stat -c%s "$out/nso-album-sync")"
          python3 -c 'import sys; s=int(sys.argv[1]); print(f"Application executable size: {s/1024/1024:.2f} MB"); print("::warning::Application executable is above the 10 MB target.") if s > 10*1024*1024 else None' "$size"

          tar -C "$out" -czf "dist/nso-album-sync-linux-${{ matrix.arch }}.tar.gz" .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: nso-album-sync-linux-${{ matrix.arch }}
          path: dist/nso-album-sync-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Assemble release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files

          # Windows workflow artifacts contain the raw executable so the
          # Actions UI does not produce zip-in-zip downloads. Create the actual
          # release archives here, once, with a clean executable name inside.
          for arch in x64 arm64; do
            artifact="release-artifacts/nso-album-sync-windows-${arch}"
            exe="$artifact/nso-album-sync.exe"
            if [[ ! -f "$exe" ]]; then
              echo "Missing Windows ${arch} executable: $exe" >&2
              exit 1
            fi
            (cd "$artifact" && zip -9 -j \
              "$GITHUB_WORKSPACE/release-files/nso-album-sync-windows-${arch}.zip" \
              nso-album-sync.exe)
          done

          # macOS and Linux jobs already create their platform-safe archives.
          for arch in arm64 x64; do
            cp \
              "release-artifacts/nso-album-sync-macos-${arch}/nso-album-sync-macos-${arch}.zip" \
              "release-files/"
            cp \
              "release-artifacts/nso-album-sync-linux-${arch}/nso-album-sync-linux-${arch}.tar.gz" \
              "release-files/"
          done

      - name: Verify release archive layout
        shell: bash
        run: |
          set -euo pipefail
          for archive in release-files/nso-album-sync-windows-*.zip; do
            echo "Contents of $archive:"
            unzip -l "$archive"
            count="$(unzip -Z1 "$archive" | wc -l | tr -d ' ')"
            if [[ "$count" != "1" ]]; then
              echo "Expected exactly one file in $archive, found $count" >&2
              exit 1
            fi
            if [[ "$(unzip -Z1 "$archive")" != "nso-album-sync.exe" ]]; then
              echo "Unexpected Windows archive contents in $archive" >&2
              exit 1
            fi
          done

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
