name: Build and Release NSO Album Sync

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nso-album-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -A x64 `
            -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
            -DNSO_STATIC_RUNTIME=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: cmake --build build --config $env:BUILD_TYPE --parallel

      - name: Sign, verify and stage Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = (Resolve-Path "build/$env:BUILD_TYPE/nso-album-sync.exe").Path
          $isReleaseTag = $env:GITHUB_REF -like "refs/tags/v*"

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            if ($isReleaseTag) {
              throw "Tagged releases require WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD so Windows downloads are Authenticode signed."
            }
            Write-Warning "Windows CI artifact is unsigned. Configure Authenticode secrets before publishing a tagged release."
          } else {
            $certificate = Join-Path $env:RUNNER_TEMP "nso-album-sync-signing.pfx"
            [IO.File]::WriteAllBytes(
              $certificate,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))

            $signtool = Get-ChildItem `
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
              -ErrorAction Stop | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe was not found" }

            & $signtool.FullName sign `
              /fd SHA256 `
              /f $certificate `
              /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              /tr "http://timestamp.digicert.com" `
              /td SHA256 `
              $exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            & $signtool.FullName verify /pa /all /v $exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Remove-Item -Force $certificate
          }

          Copy-Item $exe "dist/nso-album-sync.exe"
          $size = (Get-Item $exe).Length
          Write-Host ("Application executable size: {0:N2} MB" -f ($size / 1MB))
          if ($size -gt 10MB) {
            Write-Warning "Application executable is above the 10 MB target."
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: nso-album-sync-windows
          path: dist/nso-album-sync.exe
          if-no-files-found: error

  build-macos-slice:
    name: macOS internal ${{ matrix.arch }} slice
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            cmake_arch: arm64
            runner: macos-15
          - arch: x64
            cmake_arch: x86_64
            runner: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        shell: bash
        run: brew install cmake ninja openssl@3

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DNSO_STATIC_RUNTIME=ON

      - name: Build and verify slice
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel
          app="build/nso-album-sync.app"
          binary="$app/Contents/MacOS/nso-album-sync"
          codesign --verify --strict --verbose=2 "$app"
          lipo -archs "$binary"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/slice.zip

      - name: Upload internal macOS slice
        uses: actions/upload-artifact@v7
        with:
          name: internal-macos-${{ matrix.arch }}
          path: dist/slice.zip
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: macOS Universal 2
    needs: build-macos-slice
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Download ARM64 slice
        uses: actions/download-artifact@v5
        with:
          name: internal-macos-arm64
          path: slices/arm64

      - name: Download x64 slice
        uses: actions/download-artifact@v5
        with:
          name: internal-macos-x64
          path: slices/x64

      - name: Assemble, sign, notarize and verify Universal 2 app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unpack/arm64 unpack/x64 dist
          ditto -x -k slices/arm64/slice.zip unpack/arm64
          ditto -x -k slices/x64/slice.zip unpack/x64

          arm_app="unpack/arm64/nso-album-sync.app"
          x64_app="unpack/x64/nso-album-sync.app"
          app="dist/nso-album-sync.app"
          ditto "$arm_app" "$app"
          lipo -create \
            "$arm_app/Contents/MacOS/nso-album-sync" \
            "$x64_app/Contents/MacOS/nso-album-sync" \
            -output "$app/Contents/MacOS/nso-album-sync"

          archs="$(lipo -archs "$app/Contents/MacOS/nso-album-sync")"
          echo "Universal executable architectures: $archs"
          [[ "$archs" == *arm64* ]]
          [[ "$archs" == *x86_64* ]]

          is_release_tag=0
          [[ "$GITHUB_REF" == refs/tags/v* ]] && is_release_tag=1

          if [[ -n "${MACOS_CERTIFICATE_BASE64:-}" ]]; then
            [[ -n "${MACOS_CERTIFICATE_PASSWORD:-}" ]]
            [[ -n "${MACOS_SIGNING_IDENTITY:-}" ]]
            keychain="$RUNNER_TEMP/nso-signing.keychain-db"
            keychain_password="$(openssl rand -hex 24)"
            certificate="$RUNNER_TEMP/nso-signing.p12"
            printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$certificate" -k "$keychain" \
              -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list \
              -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
            security list-keychains -d user -s "$keychain" \
              $(security list-keychains -d user | tr -d '"')

            codesign --force --deep --options runtime --timestamp \
              --keychain "$keychain" --sign "$MACOS_SIGNING_IDENTITY" "$app"
            rm -f "$certificate"
          else
            if [[ "$is_release_tag" == 1 ]]; then
              echo "Tagged releases require a Developer ID certificate." >&2
              exit 1
            fi
            codesign --force --deep --sign - --timestamp=none "$app"
          fi

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1

          if [[ -n "${APPLE_ID:-}" && -n "${APPLE_TEAM_ID:-}" && -n "${APPLE_APP_PASSWORD:-}" && -n "${MACOS_CERTIFICATE_BASE64:-}" ]]; then
            notarization_zip="$RUNNER_TEMP/nso-album-sync-notarization.zip"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$notarization_zip"
            xcrun notarytool submit "$notarization_zip" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"
          elif [[ "$is_release_tag" == 1 ]]; then
            echo "Tagged releases require Apple notarization credentials." >&2
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent "$app" \
            dist/nso-album-sync-macOS.zip

      - name: Upload macOS Universal build
        uses: actions/upload-artifact@v7
        with:
          name: nso-album-sync-macos
          path: dist/nso-album-sync-macOS.zip
          if-no-files-found: error

  build-linux:
    name: Linux x64 AppImage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build curl libssl-dev libsecret-1-dev \
            libgtk-3-dev libayatana-appindicator3-dev

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DNSO_STATIC_RUNTIME=ON \
            -DNSO_ENABLE_LINUX_TRAY=ON

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist tools

          cat > nso-album-sync.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=NSO Album Sync
          Comment=Sync Nintendo Switch Online album captures
          Exec=nso-album-sync
          Icon=nso-album-sync
          Categories=Utility;Photography;
          Terminal=false
          DESKTOP

          deploy="tools/linuxdeploy-x86_64.AppImage"
          plugin="tools/linuxdeploy-plugin-appimage-x86_64.AppImage"
          curl -fL --retry 3 -o "$deploy" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage"
          curl -fL --retry 3 -o "$plugin" \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-appimage-x86_64.AppImage"
          chmod +x "$deploy" "$plugin"

          export PATH="$PWD/tools:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export OUTPUT="$PWD/dist/nso-album-sync.AppImage"
          "$deploy" --appimage-extract-and-run \
            --appdir AppDir \
            --executable build/nso-album-sync \
            --desktop-file nso-album-sync.desktop \
            --icon-file icon.svg \
            --output appimage

          chmod +x dist/nso-album-sync.AppImage
          file dist/nso-album-sync.AppImage
          size="$(stat -c%s dist/nso-album-sync.AppImage)"
          python3 -c 'import sys; s=int(sys.argv[1]); print(f"AppImage size: {s/1024/1024:.2f} MB")' "$size"

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v7
        with:
          name: nso-album-sync-linux
          path: dist/nso-album-sync.AppImage
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v5
        with:
          name: nso-album-sync-windows
          path: release-input/windows

      - name: Download macOS build
        uses: actions/download-artifact@v5
        with:
          name: nso-album-sync-macos
          path: release-input/macos

      - name: Download Linux build
        uses: actions/download-artifact@v5
        with:
          name: nso-album-sync-linux
          path: release-input/linux

      - name: Assemble the three platform downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          cp release-input/windows/nso-album-sync.exe release-files/nso-album-sync.exe
          cp release-input/macos/nso-album-sync-macOS.zip release-files/nso-album-sync-macOS.zip
          cp release-input/linux/nso-album-sync.AppImage release-files/nso-album-sync.AppImage
          chmod +x release-files/nso-album-sync.AppImage
          test "$(find release-files -maxdepth 1 -type f ! -name SHA256SUMS.txt | wc -l | tr -d ' ')" = "3"
          ls -lh release-files

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-files
          sha256sum nso-album-sync.exe nso-album-sync-macOS.zip nso-album-sync.AppImage \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
