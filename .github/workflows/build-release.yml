name: Build and Release NSO Album Sync

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nso-album-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BUILD_TYPE: Release
  DISCORD_SDK_REPOSITORY: Dycool/NSO-Album-Sync-SDK
  DISCORD_SDK_REF: 21aa7516c44e2856d1fe0927f0c13c092182e2b7

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout private Discord Social SDK
        uses: actions/checkout@v6
        with:
          repository: ${{ env.DISCORD_SDK_REPOSITORY }}
          ref: ${{ env.DISCORD_SDK_REF }}
          path: third_party/discord_social_sdk
          token: ${{ secrets.NSO_SDK_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -A x64 `
            -DNSO_STATIC_RUNTIME=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: cmake --build build --config $env:BUILD_TYPE --parallel

      - name: Stage and verify Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = (Resolve-Path "build/$env:BUILD_TYPE/nso-album-sync.exe").Path
          Copy-Item $exe "dist/nso-album-sync.exe"

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class NsoResourceCheck {
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern IntPtr LoadLibraryExW(string fileName, IntPtr file, uint flags);
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, EntryPoint = "FindResourceW", SetLastError = true)]
              public static extern IntPtr FindResource(IntPtr module, IntPtr name, IntPtr type);
              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern uint SizeofResource(IntPtr module, IntPtr resource);
              [DllImport("kernel32.dll")]
              public static extern bool FreeLibrary(IntPtr module);
          }
          "@

          $module = [NsoResourceCheck]::LoadLibraryExW($exe, [IntPtr]::Zero, 0x2)
          if ($module -eq [IntPtr]::Zero) { throw "Could not inspect staged executable resources" }
          try {
            $rtRcData = [IntPtr]10
            foreach ($expected in @(
              @{ Id = 201; Minimum = 1MB; Name = "Discord runtime" },
              @{ Id = 202; Minimum = 1KB; Name = "third-party notices" }
            )) {
              $resource = [NsoResourceCheck]::FindResource(
                $module, [IntPtr]$expected.Id, $rtRcData)
              if ($resource -eq [IntPtr]::Zero) {
                throw "Missing embedded $($expected.Name) resource $($expected.Id)"
              }
              $resourceSize = [NsoResourceCheck]::SizeofResource($module, $resource)
              if ($resourceSize -lt $expected.Minimum) {
                throw "Embedded $($expected.Name) resource is unexpectedly small ($resourceSize bytes)"
              }
              Write-Host "$($expected.Name) resource: $resourceSize bytes"
            }
          } finally {
            [void][NsoResourceCheck]::FreeLibrary($module)
          }

          $selfTest = Start-Process `
            -FilePath $exe `
            -ArgumentList "--self-test" `
            -Wait `
            -PassThru
          Write-Host "Packaged Windows runtime self-test exit code: $($selfTest.ExitCode)"
          if ($selfTest.ExitCode -ne 0) {
            throw "Packaged Windows runtime self-test failed with exit code $($selfTest.ExitCode)"
          }

          $files = @(Get-ChildItem dist -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "nso-album-sync.exe") {
            throw "Windows distribution must contain exactly one executable"
          }

          $size = (Get-Item $exe).Length
          Write-Host ("Application executable size: {0:N2} MB" -f ($size / 1MB))
          if ($size -gt 15MB) {
            Write-Warning "Application executable is above the 15 MB target."
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: nso-album-sync-windows
          path: dist/nso-album-sync.exe
          if-no-files-found: error

  build-macos:
    name: macOS 15 Apple Silicon (20 MiB maximum)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout private Discord Social SDK
        uses: actions/checkout@v6
        with:
          repository: ${{ env.DISCORD_SDK_REPOSITORY }}
          ref: ${{ env.DISCORD_SDK_REF }}
          path: third_party/discord_social_sdk
          token: ${{ secrets.NSO_SDK_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: brew install cmake ninja openssl@3

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_CXX_FLAGS_RELEASE="-Oz -DNDEBUG" \
            -DCMAKE_OBJCXX_FLAGS_RELEASE="-Oz -DNDEBUG" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DNSO_STATIC_RUNTIME=ON

      - name: Build, slim and package Apple Silicon app
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel

          app="build/nso-album-sync.app"
          binary="$app/Contents/MacOS/nso-album-sync"
          framework_root="$app/Contents/Frameworks/discord_partner_sdk.framework"
          framework="$framework_root/Versions/A/discord_partner_sdk"
          notices="$app/Contents/Resources/THIRD-PARTY-NOTICES.txt"

          test -x "$binary"
          test -f "$framework"
          test -s "$notices"
          [[ "$(lipo -archs "$binary")" == "arm64" ]]

          sdk_archs="$(lipo -archs "$framework")"
          echo "Discord framework architectures before thinning: $sdk_archs"
          [[ "$sdk_archs" == *arm64* ]]
          if [[ "$sdk_archs" == *x86_64* ]]; then
            lipo "$framework" -thin arm64 -output "$framework.arm64"
            mv "$framework.arm64" "$framework"
          fi
          [[ "$(lipo -archs "$framework")" == "arm64" ]]

          # This app only uses Discord Rich Presence. Discord documents Krisp
          # as optional and removable for size-sensitive distributions.
          rm -rf "$framework_root/Versions/A/Frameworks/libdiscord_krisp.dylib"
          rm -rf "$framework_root/Versions/A/Resources/Krisp"
          find "$framework_root" -type f \( -iname '*krisp*' -o -iname '*.kef' -o -iname '*.kw' \) -delete
          if find "$framework_root" \( -iname '*krisp*' -o -iname '*.kef' -o -iname '*.kw' \) -print -quit | grep -q .; then
            echo "Krisp payload remained in the macOS framework" >&2
            exit 1
          fi

          rm -f "$framework_root/Headers"
          rm -rf "$framework_root/Versions/A/Headers"
          rm -rf "$framework_root/Versions/A/_CodeSignature"
          find "$framework_root" -type d -name '*.dSYM' -prune -exec rm -rf {} + 2>/dev/null || true

          codesign --remove-signature "$binary" 2>/dev/null || true
          codesign --remove-signature "$framework" 2>/dev/null || true

          binary_before="$(stat -f%z "$binary")"
          framework_before="$(stat -f%z "$framework")"
          strip -S -x "$binary"
          strip -S -x "$framework"
          binary_after="$(stat -f%z "$binary")"
          framework_after="$(stat -f%z "$framework")"
          echo "macOS app binary: $binary_before -> $binary_after bytes"
          echo "ARM64 Discord framework: $framework_before -> $framework_after bytes"

          if otool -L "$framework" | grep -qi krisp; then
            echo "Discord core framework unexpectedly hard-links Krisp" >&2
            exit 1
          fi

          otool -L "$binary"
          otool -L "$binary" | grep -q "discord_partner_sdk.framework"
          vtool -show-build "$binary"
          vtool -show-build "$binary" | grep -Eq 'minos[[:space:]]+15\.0([[:space:]]|$)'

          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1
          "$binary" --self-test

          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent --zlibCompressionLevel 9 \
            "$app" dist/nso-album-sync-macOS.zip

          app_kib="$(du -sk "$app" | awk '{print $1}')"
          zip_bytes="$(stat -f%z dist/nso-album-sync-macOS.zip)"
          echo "Apple Silicon app size: $((app_kib / 1024)) MiB"
          echo "macOS release ZIP size: $((zip_bytes / 1024 / 1024)) MiB ($zip_bytes bytes)"
          echo "Largest files in macOS app:"
          du -ah "$app" | sort -h | tail -n 20

          max_bytes=$((20 * 1024 * 1024))
          if (( zip_bytes > max_bytes )); then
            echo "macOS release ZIP exceeds the hard 20 MiB limit." >&2
            exit 1
          fi

      - name: Upload macOS Apple Silicon build
        uses: actions/upload-artifact@v7
        with:
          name: nso-album-sync-macos
          path: dist/nso-album-sync-macOS.zip
          if-no-files-found: error

  build-linux:
    name: Linux x64 AppImage (glibc 2.35 baseline)
    runs-on: ubuntu-24.04
    container: ubuntu:22.04

    steps:
      - name: Install checkout prerequisites
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout private Discord Social SDK
        uses: actions/checkout@v6
        with:
          repository: ${{ env.DISCORD_SDK_REPOSITORY }}
          ref: ${{ env.DISCORD_SDK_REF }}
          path: third_party/discord_social_sdk
          token: ${{ secrets.NSO_SDK_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils build-essential cmake curl file ninja-build \
            libssl-dev libsecret-1-dev libpulse0 libasound2-dev libgtk-3-dev \
            libayatana-appindicator3-dev
          g++ --version
          getconf GNU_LIBC_VERSION
          test "$(getconf GNU_LIBC_VERSION | awk '{print $2}')" = "2.35"

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_CXX_FLAGS_RELEASE="-Os -DNDEBUG" \
            -DCMAKE_EXE_LINKER_FLAGS_RELEASE="-Wl,--as-needed" \
            -DNSO_STATIC_RUNTIME=ON \
            -DNSO_ENABLE_LINUX_TRAY=ON

      - name: Build and verify native runtime
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel
          test -x build/nso-album-sync
          test -s build/libdiscord_partner_sdk.so

          app_before="$(stat -c%s build/nso-album-sync)"
          discord_before="$(stat -c%s build/libdiscord_partner_sdk.so)"
          strip --strip-unneeded build/nso-album-sync
          strip --strip-unneeded build/libdiscord_partner_sdk.so
          app_after="$(stat -c%s build/nso-album-sync)"
          discord_after="$(stat -c%s build/libdiscord_partner_sdk.so)"
          echo "Linux app binary: $(numfmt --to=iec-i --suffix=B "$app_before") -> $(numfmt --to=iec-i --suffix=B "$app_after")"
          echo "Linux Discord runtime: $(numfmt --to=iec-i --suffix=B "$discord_before") -> $(numfmt --to=iec-i --suffix=B "$discord_after")"

          echo "Native executable dependencies:"
          LD_LIBRARY_PATH="$PWD/build" ldd build/nso-album-sync
          LD_LIBRARY_PATH="$PWD/build" ldd build/nso-album-sync | grep -q "libdiscord_partner_sdk.so"
          LD_LIBRARY_PATH="$PWD/build" ldd build/libdiscord_partner_sdk.so | grep -q "libasound.so.2"
          LD_LIBRARY_PATH="$PWD/build" build/nso-album-sync --self-test

          highest_glibc="$({ objdump -T build/nso-album-sync; objdump -T build/libdiscord_partner_sdk.so; } \
            | sed -n 's/.*GLIBC_\([0-9][0-9.]*\).*/\1/p' \
            | sort -V | tail -n 1)"
          echo "Highest directly required GLIBC symbol version: ${highest_glibc:-none}"
          if [ -n "$highest_glibc" ] && \
             [ "$(printf '%s\n%s\n' "$highest_glibc" '2.35' | sort -V | tail -n 1)" != "2.35" ]; then
            echo "Linux binary requires glibc newer than the declared 2.35 baseline" >&2
            exit 1
          fi

      - name: Build and inspect AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist tools AppDir/usr/lib AppDir/usr/share/doc/nso-album-sync

          cat > nso-album-sync.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=NSO Album Sync
          Comment=Sync Nintendo Switch Online album captures
          Exec=nso-album-sync
          Icon=nso-album-sync
          Categories=Utility;Photography;
          Terminal=false
          DESKTOP

          cp build/libdiscord_partner_sdk.so AppDir/usr/lib/libdiscord_partner_sdk.so
          cp THIRD-PARTY-NOTICES.txt \
            AppDir/usr/share/doc/nso-album-sync/THIRD-PARTY-NOTICES.txt
          cp icon.svg nso-album-sync.svg

          deploy="tools/linuxdeploy-x86_64.AppImage"
          plugin="tools/linuxdeploy-plugin-appimage-x86_64.AppImage"
          curl -fL --retry 3 -o "$deploy" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage"
          curl -fL --retry 3 -o "$plugin" \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-appimage-x86_64.AppImage"
          chmod +x "$deploy" "$plugin"

          export PATH="$PWD/tools:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export LDAI_COMP=zstd
          export OUTPUT="$PWD/dist/nso-album-sync.AppImage"
          "$deploy" --appimage-extract-and-run \
            --appdir AppDir \
            --executable build/nso-album-sync \
            --desktop-file nso-album-sync.desktop \
            --icon-file nso-album-sync.svg \
            --output appimage

          chmod +x dist/nso-album-sync.AppImage
          file dist/nso-album-sync.AppImage
          size="$(stat -c%s dist/nso-album-sync.AppImage)"
          echo "AppImage size: $(numfmt --to=iec-i --suffix=B "$size")"
          if (( size > 35 * 1024 * 1024 )); then
            echo "::warning::Linux AppImage is still above the 35 MiB size target."
          fi
          dist/nso-album-sync.AppImage --self-test

          rm -rf appimage-inspect
          mkdir appimage-inspect
          (
            cd appimage-inspect
            ../dist/nso-album-sync.AppImage --appimage-extract >/dev/null
          )
          root="appimage-inspect/squashfs-root"
          test -x "$root/usr/bin/nso-album-sync"
          test -s "$root/usr/lib/libdiscord_partner_sdk.so"
          test -s "$root/usr/share/doc/nso-album-sync/THIRD-PARTY-NOTICES.txt"
          LD_LIBRARY_PATH="$root/usr/lib" ldd "$root/usr/bin/nso-album-sync"
          LD_LIBRARY_PATH="$root/usr/lib" ldd "$root/usr/bin/nso-album-sync" \
            | grep -q "libdiscord_partner_sdk.so"
          echo "Largest files in AppImage:"
          du -ah "$root" | sort -h | tail -n 20

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v7
        with:
          name: nso-album-sync-linux
          path: dist/nso-album-sync.AppImage
          if-no-files-found: error

  release-gate:
    name: Release gate
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm all release builds passed
        run: echo "Windows, macOS, and Linux release artifacts passed packaging and runtime checks."

  release:
    name: GitHub Release
    needs: [release-gate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v5
        with:
          name: nso-album-sync-windows
          path: release-input/windows

      - name: Download macOS build
        uses: actions/download-artifact@v5
        with:
          name: nso-album-sync-macos
          path: release-input/macos

      - name: Download Linux build
        uses: actions/download-artifact@v5
        with:
          name: nso-album-sync-linux
          path: release-input/linux

      - name: Assemble the three platform downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          cp release-input/windows/nso-album-sync.exe release-files/nso-album-sync.exe
          cp release-input/macos/nso-album-sync-macOS.zip release-files/nso-album-sync-macOS.zip
          cp release-input/linux/nso-album-sync.AppImage release-files/nso-album-sync.AppImage
          chmod +x release-files/nso-album-sync.AppImage
          test "$(find release-files -maxdepth 1 -type f ! -name SHA256SUMS.txt | wc -l | tr -d ' ')" = "3"
          ls -lh release-files

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-files
          sha256sum nso-album-sync.exe nso-album-sync-macOS.zip nso-album-sync.AppImage \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
