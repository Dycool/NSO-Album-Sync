name: Rust safety and build

on:
  push:
    branches: [rust-port, main]
    tags: ["v*"]
  pull_request:
    branches: [rust-port, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev pkg-config

      - name: Toolchain
        run: rustup show active-toolchain

      - name: Enforce Rust safety boundary
        run: python scripts/check_rust_safety.py

      - name: Check pure safe core
        run: cargo check --lib --no-default-features

      - name: Check all targets
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      - name: Self test
        run: cargo run -- --self-test

      - name: Export dependency lock
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error

  miri:
    name: Miri safe core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Enforce Rust safety boundary
        run: python scripts/check_rust_safety.py

      - name: Install pinned Miri toolchain
        shell: bash
        run: rustup toolchain install nightly-2026-09-03 --profile minimal --component miri

      - name: Miri setup
        shell: bash
        run: cargo +nightly-2026-09-03 miri setup

      - name: Miri tests
        shell: bash
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: cargo +nightly-2026-09-03 miri test --lib --no-default-features
