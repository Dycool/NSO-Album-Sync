name: Restore build workflow

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  TARGET_SHA: fdce1a35dabf8ec03692a8e4a28927eb12da4aa7

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore normal workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_SHA" --depth=1
          git checkout "$TARGET_SHA" -- .github/workflows/build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build.yml
          git commit -m "chore(release): restore build workflow"
          git push origin HEAD:main
