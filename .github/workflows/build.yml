name: Finish v1.1.1 refresh

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

env:
  TARGET_TAG: v1.1.1
  TARGET_SHA: 8d5018cb4b215a4d747c4869f92950777623bdd1
  SOURCE_RUN_ID: 33318669193

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: release-artifacts

      - name: Retag and replace release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          git fetch origin "$TARGET_SHA" --depth=1
          git tag -f "$TARGET_TAG" "$TARGET_SHA"
          git push origin "refs/tags/$TARGET_TAG" --force

          mkdir -p release-dist
          (cd release-artifacts/nso-album-sync-windows && zip -9 ../../release-dist/nso-album-sync-windows.zip nso-album-sync.exe)
          cp release-artifacts/nso-album-sync-macos/nso-album-sync.zip release-dist/nso-album-sync-macos.zip
          (cd release-artifacts/nso-album-sync-linux && zip -9 ../../release-dist/nso-album-sync-linux.zip nso-album-sync.AppImage)

          files=(
            release-dist/nso-album-sync-windows.zip
            release-dist/nso-album-sync-macos.zip
            release-dist/nso-album-sync-linux.zip
          )
          gh release upload "$TARGET_TAG" "${files[@]}" --clobber
