name: Apply Coral login encryption fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          nxapi = Path("src/nxapi.cpp")
          text = nxapi.read_text()
          needle = '{"token", coral_token},'
          replacement = '{"token", coral_token.empty() ? Json(nullptr) : Json(coral_token)},'
          count = text.count(needle)
          if count == 1:
              nxapi.write_text(text.replace(needle, replacement, 1))
          elif replacement not in text:
              raise SystemExit(f"expected one nxapi token field, found {count}")

          coral = Path("src/coral.cpp")
          text = coral.read_text()
          needle = 'coral_url(kLoginPath), nintendo_tokens.id_token, request_body.dump());'
          replacement = 'coral_url(kLoginPath), "", request_body.dump());'
          count = text.count(needle)
          if count == 1:
              coral.write_text(text.replace(needle, replacement, 1))
          elif replacement not in text:
              raise SystemExit(f"expected one Coral login encrypt call, found {count}")
          PY

          if git diff --quiet -- src/nxapi.cpp src/coral.cpp; then
            echo "No source change needed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nxapi.cpp src/coral.cpp
          git diff --cached --check
          git diff --cached
          git commit -m "fix: send null token for Coral login encryption"
          git push origin HEAD:main
