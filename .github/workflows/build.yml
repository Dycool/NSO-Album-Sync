name: Refresh v1.1.1 after auth fix

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Retag and replace verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: "33336314990"
          TARGET_SHA: "2ee1c57baed00ec18f42ccf6267ab9aee1ae1642"
          TAG: "v1.1.1"
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --dir release-artifacts
          mkdir -p release-dist
          (cd release-artifacts/nso-album-sync-windows && zip -9 ../../release-dist/nso-album-sync-windows.zip nso-album-sync.exe)
          cp release-artifacts/nso-album-sync-macos/nso-album-sync.zip release-dist/nso-album-sync-macos.zip
          (cd release-artifacts/nso-album-sync-linux && zip -9 ../../release-dist/nso-album-sync-linux.zip nso-album-sync.AppImage)

          git tag -f "$TAG" "$TARGET_SHA"
          git push --force origin "refs/tags/$TAG"

          gh release upload "$TAG" \
            release-dist/nso-album-sync-windows.zip \
            release-dist/nso-album-sync-macos.zip \
            release-dist/nso-album-sync-linux.zip \
            --clobber
