name: Apply Coral login encryption fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          nxapi = Path("src/nxapi.cpp")
          text = nxapi.read_text()
          old = '''    const Json payload(Json::object{
              {"url", url},
              {"token", coral_token},
              {"data", json},
          });'''
          new = '''    const Json payload(Json::object{
              {"url", url},
              // nxapi requires JSON null when the Nintendo Coral request does
              // not carry an Authorization header (Account/Login/GetToken).
              {"token", coral_token.empty() ? Json(nullptr) : Json(coral_token)},
              {"data", json},
          });'''
          if old in text:
              nxapi.write_text(text.replace(old, new, 1))

          coral = Path("src/coral.cpp")
          text = coral.read_text()
          old = '''        const auto encrypted_login = nxapi_.encrypt_request(
              coral_url(kLoginPath), nintendo_tokens.id_token, request_body.dump());'''
          new = '''        // Account/Login has no Nintendo Coral Authorization header, so the
          // nxapi encryption token must be JSON null rather than the NA id_token.
          const auto encrypted_login = nxapi_.encrypt_request(
              coral_url(kLoginPath), "", request_body.dump());'''
          if old in text:
              coral.write_text(text.replace(old, new, 1))
          PY

          if git diff --quiet -- src/nxapi.cpp src/coral.cpp; then
            echo "Source already patched"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nxapi.cpp src/coral.cpp
          git diff --cached --check
          git commit -m "fix: send null token for Coral login encryption"
          git push origin HEAD:main
