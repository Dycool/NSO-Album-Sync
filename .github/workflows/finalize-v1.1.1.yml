name: Finalize v1.1.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-v1.1.1.yml

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v1.1.1
      TARGET_SHA: 4bf68e57532fe91844ac7a95fd39d00c0f228559
      BUILD_RUN_ID: '33277474833'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tested release candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" --jq .head_sha)" = "$TARGET_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" --jq .status)" = "completed"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" --jq .conclusion)" = "success"

      - name: Download tested artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts release-dist
          gh run download "$BUILD_RUN_ID" --dir release-artifacts
          (cd release-artifacts/nso-album-sync-windows && zip -9 ../../release-dist/nso-album-sync-windows.zip nso-album-sync.exe)
          cp release-artifacts/nso-album-sync-macos/nso-album-sync.zip release-dist/nso-album-sync-macos.zip
          (cd release-artifacts/nso-album-sync-linux && zip -9 ../../release-dist/nso-album-sync-linux.zip nso-album-sync.AppImage)
          test -s release-dist/nso-album-sync-windows.zip
          test -s release-dist/nso-album-sync-macos.zip
          test -s release-dist/nso-album-sync-linux.zip

      - name: Point v1.1.1 at final tested commit
        shell: bash
        run: |
          set -euo pipefail
          git tag -f "$TAG" "$TARGET_SHA"
          git push --force origin "refs/tags/$TAG"

      - name: Replace release assets and notes
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          ## What's changed

          ### Discord Rich Presence
          - Significantly expanded game-specific Rich Presence for **The Legend of Zelda: Breath of the Wild / Tears of the Kingdom**, **Splatoon 2 / 3**, and **Animal Crossing: New Horizons**.
          - Added richer player, stage, region, POI, rank, weapon, avatar, and play-session context where supported by Nintendo's game services.
          - Added Zelda live-location overlays with dynamic region/landmark context and artwork while keeping recurring Coral polling lightweight.
          - Improved Nintendo profile/resident imagery in Discord, including handling long NookLink resident image URLs while enforcing Discord's activity image URL limit after profile refreshes.
          - Improved RPC lifecycle, title routing, localization, caching, account switching, refresh behavior, and stale-presence cleanup.

          ### macOS
          - Restored **macOS Keychain** storage for Nintendo and Coral credentials.
          - Added one-time migration away from the temporary plaintext credential files used during testing, removing those files after migration; unsafe legacy files are discarded instead of reused.
          - Improved Nintendo Account callback handling, URL/path handling, notifications, TLS behavior, packaging, and code-sign verification.
          - Release builds intentionally target **macOS 15+ on Apple Silicon (arm64)**.

          ### Reliability and packaging
          - Improved HTTP, redirect, cookie, TLS-handshake, and game-service robustness across platforms.
          - Updated packaged application metadata to **1.1.1**.
          - Removed persistent per-poll RPC presence debug-file logging from normal app operation.
          - Additional stability and packaging fixes across Windows, macOS, and Linux.

          ## Compatibility
          - Windows 10+ x64
          - macOS 15+ Apple Silicon (arm64)
          - Linux x64 with glibc 2.35+
          NOTES

          files=(
            release-dist/nso-album-sync-windows.zip
            release-dist/nso-album-sync-macos.zip
            release-dist/nso-album-sync-linux.zip
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" \
              --title "v1.1.1 - RPC and macOS improvements" \
              --notes-file release-notes.md \
              --draft=false
          else
            gh release create "$TAG" "${files[@]}" \
              --target "$TARGET_SHA" \
              --title "v1.1.1 - RPC and macOS improvements" \
              --notes-file release-notes.md
          fi
