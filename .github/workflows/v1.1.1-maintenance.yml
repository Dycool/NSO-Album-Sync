name: v1.1.1 release maintenance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v1.1.1-maintenance.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: run v1.1.1 release maintenance'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply audited release fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          def replace_all_exact(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}")
              p.write_text(text.replace(old, new))

          secure_store = r'''#include "nso_album_sync/secure_store.hpp"

#ifdef __APPLE__

#import <Foundation/Foundation.h>
#import <Security/Security.h>

#include <cerrno>
#include <cctype>
#include <filesystem>
#include <fcntl.h>
#include <sys/stat.h>
#include <unistd.h>

namespace nso {
namespace {

NSString* const kKeychainService = @"org.nsoalbumsync.session-token";
constexpr std::size_t kMaxLegacySecretBytes = 64 * 1024;

NSDictionary* keychain_query(NSString* account) {
    return @{
        (id)kSecClass: (id)kSecClassGenericPassword,
        (id)kSecAttrService: kKeychainService,
        (id)kSecAttrAccount: account,
    };
}

std::filesystem::path legacy_credentials_directory() {
    const char* home = std::getenv("HOME");
    return std::filesystem::path(home ? home : ".") /
        "Library" / "Application Support" / "NSOAlbumSync" / "credentials";
}

std::string safe_account_name(const std::string& account) {
    std::string safe;
    safe.reserve(account.size());
    for (const unsigned char ch : account) {
        if (std::isalnum(ch) || ch == '-' || ch == '_') {
            safe.push_back(static_cast<char>(ch));
        } else {
            safe.push_back('_');
        }
    }
    return safe.empty() ? std::string("credential") : safe;
}

std::filesystem::path legacy_credential_path(const std::string& account) {
    return legacy_credentials_directory() / (safe_account_name(account) + ".dat");
}

void remove_legacy_credential(const std::string& account) {
    std::error_code error;
    std::filesystem::remove(legacy_credential_path(account), error);
    error.clear();
    std::filesystem::remove(legacy_credentials_directory(), error);
}

std::optional<std::string> read_legacy_credential(const std::string& account) {
    const auto path = legacy_credential_path(account);
    const int fd = open(path.c_str(), O_RDONLY | O_CLOEXEC | O_NOFOLLOW);
    if (fd < 0) return std::nullopt;

    struct stat info {};
    if (fstat(fd, &info) != 0 ||
        !S_ISREG(info.st_mode) ||
        info.st_uid != getuid() ||
        (info.st_mode & 0077) != 0 ||
        info.st_size <= 0 ||
        static_cast<std::uint64_t>(info.st_size) > kMaxLegacySecretBytes) {
        close(fd);
        return std::nullopt;
    }

    std::string secret(static_cast<std::size_t>(info.st_size), '\0');
    std::size_t offset = 0;
    while (offset < secret.size()) {
        const auto amount = read(fd, secret.data() + offset, secret.size() - offset);
        if (amount < 0 && errno == EINTR) continue;
        if (amount <= 0) {
            close(fd);
            return std::nullopt;
        }
        offset += static_cast<std::size_t>(amount);
    }
    close(fd);
    return secret;
}

bool keychain_put(const std::string& account, const std::string& secret) {
    @autoreleasepool {
        NSString* account_string = [NSString stringWithUTF8String:account.c_str()];
        if (account_string == nil) return false;
        NSData* secret_data = [NSData dataWithBytes:secret.data() length:secret.size()];
        NSDictionary* query = keychain_query(account_string);
        NSDictionary* update = @{(id)kSecValueData: secret_data};

        OSStatus status = SecItemUpdate(
            (CFDictionaryRef)query,
            (CFDictionaryRef)update);
        if (status == errSecItemNotFound) {
            NSMutableDictionary* item =
                [NSMutableDictionary dictionaryWithDictionary:query];
            item[(id)kSecValueData] = secret_data;
            status = SecItemAdd((CFDictionaryRef)item, nullptr);
        }
        return status == errSecSuccess;
    }
}

std::optional<std::string> keychain_get(const std::string& account) {
    @autoreleasepool {
        NSString* account_string = [NSString stringWithUTF8String:account.c_str()];
        if (account_string == nil) return std::nullopt;
        NSMutableDictionary* query =
            [NSMutableDictionary dictionaryWithDictionary:keychain_query(account_string)];
        query[(id)kSecReturnData] = @YES;
        query[(id)kSecMatchLimit] = (id)kSecMatchLimitOne;

        CFTypeRef result = nullptr;
        const OSStatus status = SecItemCopyMatching(
            (CFDictionaryRef)query,
            &result);
        if (status != errSecSuccess || result == nullptr) {
            if (result != nullptr) CFRelease(result);
            return std::nullopt;
        }

        NSData* data = (__bridge NSData*)result;
        const auto* bytes = static_cast<const char*>(data.bytes);
        std::string secret(bytes, bytes + data.length);
        CFRelease(result);
        return secret;
    }
}

std::optional<std::string> migrate_legacy_credential(const std::string& account) {
    const auto legacy = read_legacy_credential(account);
    if (!legacy) return std::nullopt;

    // Temporary development builds stored these secrets as plaintext files.
    // Import once into Keychain, then remove the plaintext copy. If Keychain
    // rejects the import, remove the unsafe copy anyway and require sign-in
    // again rather than silently continuing insecure persistence.
    const bool stored = keychain_put(account, *legacy);
    remove_legacy_credential(account);
    return stored ? legacy : std::nullopt;
}

void migrate_known_legacy_credentials() {
    for (const char* account : {"NintendoAccount", "CoralCredential"}) {
        if (keychain_get(account)) {
            remove_legacy_credential(account);
        } else {
            (void)migrate_legacy_credential(account);
        }
    }
}

}  // namespace

bool SecureStore::available() {
    static const bool migrated = [] {
        migrate_known_legacy_credentials();
        return true;
    }();
    (void)migrated;
    return true;
}

bool SecureStore::put(const std::string& account, const std::string& secret) {
    const bool stored = keychain_put(account, secret);
    // Never leave a plaintext development-store duplicate behind, regardless
    // of whether the new Keychain write succeeds.
    remove_legacy_credential(account);
    return stored;
}

std::optional<std::string> SecureStore::get(const std::string& account) {
    if (const auto secret = keychain_get(account)) {
        remove_legacy_credential(account);
        return secret;
    }
    return migrate_legacy_credential(account);
}

void SecureStore::erase(const std::string& account) {
    @autoreleasepool {
        NSString* account_string = [NSString stringWithUTF8String:account.c_str()];
        if (account_string != nil) {
            SecItemDelete((CFDictionaryRef)keychain_query(account_string));
        }
    }
    remove_legacy_credential(account);
}

}  // namespace nso

#endif  // __APPLE__
'''
          Path("src/secure_store_macos.mm").write_text(secure_store)

          replace_once(
              "CMakeLists.txt",
              "    VERSION 2.0.0\n",
              "    VERSION 1.1.1\n")

          app = Path("src/app.cpp")
          text = app.read_text()
          for include in ("#include <filesystem>\n", "#include <fstream>\n"):
              if text.count(include) != 1:
                  raise SystemExit(f"src/app.cpp: unexpected include count for {include!r}")
              text = text.replace(include, "", 1)
          log_helper = '''void log_app_presence(const std::string& msg) {
              std::cerr << "[AppPresence] " << msg << "\\n";
              try {
                  const auto path = std::filesystem::temp_directory_path() / "nso-album-sync-rpc.log";
                  std::ofstream output(path, std::ios::app);
                  if (output) output << "[AppPresence] " << msg << '\\n';
              } catch (...) {}
          }

          '''
          if text.count(log_helper) != 1:
              raise SystemExit("src/app.cpp: persistent RPC log helper did not match")
          text = text.replace(log_helper, "", 1)
          for line in (
              '                log_app_presence("Polled presence: is_playing=" + std::string(presence.is_playing() ? "true" : "false") + " title_id=" + presence.title_id + " game_name=" + presence.game_name);\n',
              '                    log_app_presence("Service routing: service=" + std::to_string(static_cast<int>(service)));\n',
          ):
              if text.count(line) != 1:
                  raise SystemExit(f"src/app.cpp: expected diagnostic line not found: {line.strip()}")
              text = text.replace(line, "", 1)
          app.write_text(text)

          header = Path("include/nso_album_sync/game_services.hpp")
          text = header.read_text()
          for old in (
              "    std::string shorten_image_url(const std::string& url);\n",
              "        shortened_urls_.clear();\n",
              "    std::unordered_map<std::string, std::string> shortened_urls_;\n",
          ):
              if text.count(old) != 1:
                  raise SystemExit(f"game_services.hpp: expected one match for {old!r}")
              text = text.replace(old, "", 1)
          header.write_text(text)

          services = Path("src/game_services.cpp")
          text = services.read_text()
          for include in ("#include <filesystem>\n", "#include <fstream>\n"):
              if text.count(include) != 1:
                  raise SystemExit(f"game_services.cpp: unexpected include count for {include!r}")
              text = text.replace(include, "", 1)
          old_log = '''void log_nooklink_failure(const std::string& stage) {
              // Deliberately stage/status only. Never log GameWebServiceToken, _gtoken,
              // per-user auth tokens, Nintendo user IDs, cookies or profile payloads.
              const auto line = std::string("[NookLink RPC] ") + stage;
              std::cerr << line << '\\n';
              try {
                  static std::mutex log_mutex;
                  std::lock_guard lock(log_mutex);
                  const auto path = std::filesystem::temp_directory_path() /
                      "nso-album-sync-rpc.log";
                  std::ofstream output(path, std::ios::app);
                  if (output) output << line << '\\n';
              } catch (...) {
              }
          }
          '''
          new_log = '''void log_nooklink_failure(const std::string& stage) {
              // Deliberately stage/status only. Never log GameWebServiceToken, _gtoken,
              // per-user auth tokens, Nintendo user IDs, cookies or profile payloads.
              std::cerr << "[NookLink RPC] " << stage << '\\n';
          }
          '''
          if text.count(old_log) != 1:
              raise SystemExit("game_services.cpp: persistent NookLink log helper did not match")
          text = text.replace(old_log, new_log, 1)
          old_clear = "    shortened_urls_.clear();\n"
          if text.count(old_clear) != 1:
              raise SystemExit("game_services.cpp: shortened URL cache clear did not match")
          text = text.replace(old_clear, "", 1)
          old_shorten = '''std::string GameServicesClient::shorten_image_url(const std::string& url) {
              if (url.empty() || url.size() <= 300) return url;
              {
                  std::lock_guard lock(mutex_);
                  const auto it = shortened_urls_.find(url);
                  if (it != shortened_urls_.end()) return it->second;
              }

              try {
                  const auto response = http_.get(
                      "https://tinyurl.com/api-create.php?url=" + url_encode(url),
                      {},
                      5);
                  if (response.status == 200) {
                      auto short_url = trim_cookie_piece(response.text());
                      if (!short_url.empty() && short_url.rfind("https://", 0) == 0 && short_url.size() <= 300) {
                          std::lock_guard lock(mutex_);
                          shortened_urls_[url] = short_url;
                          return short_url;
                      }
                  }
              } catch (...) {
              }
              return url;
          }

          '''
          if text.count(old_shorten) != 1:
              raise SystemExit("game_services.cpp: TinyURL helper did not match")
          text = text.replace(old_shorten, "", 1)
          old_call = '''        if (!presence.image_uri.empty() && presence.image_uri.size() > 300) {
              presence.image_uri = shorten_image_url(presence.image_uri);
          }
          '''
          if text.count(old_call) != 1:
              raise SystemExit("game_services.cpp: TinyURL call did not match")
          text = text.replace(old_call, "", 1)
          services.write_text(text)

          replace_all_exact(
              "src/splatnet.cpp",
              '"Referrer: "',
              '"Referer: "',
              2)

          replace_once(
              "README.md",
              "Release builds target **Windows 10+ x64**, **macOS 11+ Universal 2**, and **Linux x64 with glibc 2.35+**.",
              "Release builds target **Windows 10+ x64**, **macOS 15+ Apple Silicon**, and **Linux x64 with glibc 2.35+**.")

          Path(".github/workflows/v1.1.1-maintenance.yml").unlink()
          PY

          git diff --check
          ! grep -R "tinyurl.com\|nso-album-sync-rpc.log\|log_app_presence" src include
          grep -q 'VERSION 1.1.1' CMakeLists.txt
          grep -q 'kSecClassGenericPassword' src/secure_store_macos.mm
          grep -q 'macOS 15+ Apple Silicon' README.md

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden v1.1.1 release candidate"
          git push origin HEAD:main
