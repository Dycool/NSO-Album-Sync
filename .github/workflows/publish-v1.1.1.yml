name: Publish audited v1.1.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.1.1.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify audited build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_ID: '33277341742'
          TARGET_SHA: 609a7438786fca98d758da9bea7f3a7a091b7cdc
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" --jq .head_sha)" = "$TARGET_SHA"

      - name: Download audited artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: '33277341742'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts release-dist
          gh run download "$BUILD_RUN_ID" --dir release-artifacts
          (cd release-artifacts/nso-album-sync-windows && zip -9 ../../release-dist/nso-album-sync-windows.zip nso-album-sync.exe)
          cp release-artifacts/nso-album-sync-macos/nso-album-sync.zip release-dist/nso-album-sync-macos.zip
          (cd release-artifacts/nso-album-sync-linux && zip -9 ../../release-dist/nso-album-sync-linux.zip nso-album-sync.AppImage)

      - name: Create audited tag
        env:
          TAG: v1.1.1
          TARGET_SHA: 609a7438786fca98d758da9bea7f3a7a091b7cdc
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
            test "$remote_sha" = "$TARGET_SHA"
          else
            git tag "$TAG" "$TARGET_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.1.1
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          ## What's changed

          ### Discord Rich Presence
          - Significantly expanded game-specific Rich Presence for **The Legend of Zelda: Breath of the Wild / Tears of the Kingdom**, **Splatoon 2 / 3**, and **Animal Crossing: New Horizons**.
          - Added richer player, stage, region, POI, rank, weapon, and play-session context where supported by Nintendo's game services.
          - Added Zelda live-location overlays with dynamic region/landmark context and artwork while keeping recurring Coral polling lightweight.
          - Improved Nintendo profile/resident imagery in Discord, including TinyURL shortening for NookLink resident image URLs that exceed Discord's activity-asset URL limit.
          - Improved RPC lifecycle, title routing, caching, account switching, and stale-presence cleanup.

          ### macOS
          - Restored **macOS Keychain** storage for Nintendo and Coral credentials.
          - Added one-time migration away from the temporary plaintext credential files used during testing, removing those files after migration.
          - Improved Nintendo Account callback handling, URL/path handling, notifications, TLS behavior, packaging, and code-sign verification.
          - Release builds intentionally target **macOS 15+ on Apple Silicon (arm64)**.

          ### Reliability and packaging
          - Improved HTTP proxy, redirect, cookie, TLS-handshake, and game-service robustness across platforms.
          - Updated packaged application metadata to **1.1.1**.
          - Removed temporary RPC presence debug-file logging from release behavior.
          - Additional stability and packaging fixes across Windows, macOS, and Linux.

          ## Compatibility
          - Windows 10+ x64
          - macOS 15+ Apple Silicon (arm64)
          - Linux x64 with glibc 2.35+
          NOTES

          files=(
            release-dist/nso-album-sync-windows.zip
            release-dist/nso-album-sync-macos.zip
            release-dist/nso-album-sync-linux.zip
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "v1.1.1 - RPC and macOS improvements" --notes-file release-notes.md --draft=false
          else
            gh release create "$TAG" "${files[@]}" --title "v1.1.1 - RPC and macOS improvements" --notes-file release-notes.md
          fi
